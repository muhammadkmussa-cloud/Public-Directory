<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Businesses — Umma Directory</title>
  <meta name="description" content="Search halal businesses by category, city and rating.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="container">
      <div class="page-head">
        <h1>Businesses</h1>
        <p id="resultCount">Loading…</p>
      </div>

      <form class="filters" id="filtersForm">
        <div class="filter">
          <label for="f-q">Search</label>
          <input type="text" id="f-q" name="q" placeholder="Restaurant, butcher, pharmacy…">
        </div>
        <div class="filter">
          <label for="f-category">Category</label>
          <select id="f-category" name="category">
            <option value="">All categories</option>
          </select>
        </div>
        <div class="filter">
          <label for="f-city">City</label>
          <select id="f-city" name="location">
            <option value="">All cities</option>
          </select>
        </div>
        <div class="filter">
          <label for="f-price">Price</label>
          <select id="f-price" name="price">
            <option value="">Any</option>
            <option value="$">$ Inexpensive</option>
            <option value="$$">$$ Moderate</option>
            <option value="$$$">$$$ Expensive</option>
            <option value="$$$$">$$$$ Premium</option>
          </select>
        </div>
        <div class="filter">
          <label for="f-rating">Min rating</label>
          <select id="f-rating" name="min_rating">
            <option value="0">Any</option>
            <option value="4">4+ stars</option>
            <option value="3">3+ stars</option>
          </select>
        </div>
        <div class="filter">
          <label for="f-sort">Sort by</label>
          <select id="f-sort" name="sort">
            <option value="rating">Top rated</option>
            <option value="reviews">Most reviewed</option>
            <option value="name">Name (A–Z)</option>
          </select>
        </div>
        <div class="filter">
          <button class="btn btn-primary btn-block" type="submit">Apply filters</button>
          <a class="btn btn-ghost btn-block" href="businesses.html" style="margin-top:.4rem;">Clear</a>
        </div>
      </form>

      <div class="grid" id="businessResults">
        <div class="card listing-card skeleton"><div class="skeleton-media"></div><div class="card-body"><div class="sk-line w60"></div><div class="sk-line w40"></div><div class="sk-line w80"></div></div></div>
        <div class="card listing-card skeleton"><div class="skeleton-media"></div><div class="card-body"><div class="sk-line w60"></div><div class="sk-line w40"></div><div class="sk-line w80"></div></div></div>
        <div class="card listing-card skeleton"><div class="skeleton-media"></div><div class="card-body"><div class="sk-line w60"></div><div class="sk-line w40"></div><div class="sk-line w80"></div></div></div>
      </div>
      <div id="pagination"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/pages/businesses.js"></script>
</body>
</html>
