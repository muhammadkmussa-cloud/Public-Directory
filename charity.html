<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charity — Ummah Directory</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ummah Directory">
  <meta property="og:title" content="Charity — Ummah Directory">
  <meta property="og:description" content="Find halal businesses, mosques with prayer times, and trusted fundis near you.">
  <meta property="og:url" content="https://yourdomain.com/charity.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="description" content="Charity details, campaigns and donations.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#d32323">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="container">
      <a class="back-link" href="charities.html">← Back to charities</a>
      <div id="charityDetail"><!-- filled by charity.js --></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <!-- Donate modal -->
  <div class="modal-overlay" id="donateModal" role="dialog" aria-modal="true" aria-labelledby="donateModalTitle">
    <div class="modal">
      <button class="modal-close" data-close-donate aria-label="Close">×</button>
      <h2 id="donateModalTitle">Make a donation</h2>
      <div id="donateAlert"></div>
      <form id="donateForm">
        <input type="hidden" id="dnCharityId" name="charity_id">
        <input type="hidden" id="dnCampaignId" name="campaign_id">
        <div class="form-group">
          <label>Amount (KSh)</label>
          <div class="donate-amounts">
            <button type="button" class="amount-btn" data-amount="200">200</button>
            <button type="button" class="amount-btn" data-amount="500">500</button>
            <button type="button" class="amount-btn" data-amount="1000">1,000</button>
            <button type="button" class="amount-btn" data-amount="5000">5,000</button>
            <input type="number" id="dnAmount" name="amount" min="10" max="500000" placeholder="Custom" required style="width:100%;padding:.6rem .8rem;border:1.5px solid var(--border-2);border-radius:6px;font:inherit;margin-top:.4rem;">
          </div>
        </div>
        <div class="form-group">
          <label for="dnMethod">Payment method</label>
          <select id="dnMethod" name="payment_method" style="width:100%;padding:.6rem .8rem;border:1.5px solid var(--border-2);border-radius:6px;font:inherit;">
            <option value="mpesa">M-Pesa (STK push)</option>
            <option value="paypal">PayPal</option>
            <option value="bank">Bank transfer</option>
          </select>
        </div>
        <div class="form-group" id="dnPhoneGroup">
          <label for="dnPhone">M-Pesa number</label>
          <input type="tel" id="dnPhone" name="donor_phone" placeholder="07XX XXX XXX">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="dnName">Name (optional)</label>
            <input type="text" id="dnName" name="donor_name" placeholder="Your name">
          </div>
          <div class="form-group">
            <label for="dnEmail">Email (optional)</label>
            <input type="email" id="dnEmail" name="donor_email" placeholder="you@example.com">
          </div>
        </div>
        <div class="form-group">
          <label class="checkbox-filter"><input type="checkbox" name="is_anonymous" value="1"> Donate anonymously</label>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="donateBtn">Donate now</button>
      </form>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/share.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/pages/charity.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
