<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — Umma Directory</title>
  <meta name="description" content="Reset your Umma Directory password.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="container auth-wrap">
      <div class="auth-card">
        <h1>Reset your password</h1>
        <p class="sub">Enter your email and we'll send you a reset link.</p>
        <div id="alertBox"></div>
        <form id="forgotForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="forgotBtn">Send reset link</button>
        </form>
        <div class="auth-alt">Remembered it? <a href="login.html">Login</a></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/pages/auth.js"></script>
</body>
</html>
