<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — Ummah Directory</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ummah Directory">
  <meta property="og:title" content="Forgot password — Ummah Directory">
  <meta property="og:description" content="Find halal businesses, mosques with prayer times, and trusted fundis near you.">
  <meta property="og:url" content="https://yourdomain.com/forgot.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="description" content="Reset your Ummah Directory password.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#d32323">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="container auth-wrap">
      <div class="auth-card">
        <h1>Reset your password</h1>
        <p class="sub">Enter your email and we'll send you a reset link.</p>
        <div id="alertBox"></div>
        <form id="forgotForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="forgotBtn">Send reset link</button>
        </form>
        <div class="auth-alt">Remembered it? <a href="login.html">Login</a></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/share.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/pages/auth.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
