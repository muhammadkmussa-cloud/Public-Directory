<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Umma Directory</title>
  <meta name="description" content="Login to your Umma Directory account.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="container auth-wrap">
      <div class="auth-card">
        <h1>Welcome back 👋</h1>
        <p class="sub">Login to review, check in and save your favourites.</p>
        <div id="alertBox"></div>
        <form id="loginForm">
          <div class="form-group">
            <label for="identifier">Email or username</label>
            <input type="text" id="identifier" name="identifier" required autocomplete="username" placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Login</button>
        </form>
        <div class="auth-alt" style="margin-top:.8rem;">
          <a href="forgot.html">Forgot password?</a> · Don't have an account? <a href="register.html">Sign up free</a>
        </div>
        <div class="auth-demo">
          <b>Demo accounts</b> (after installing the backend):<br>
          admin@example.com / <b>Admin@123</b> · demo@example.com / <b>Demo@123</b>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/pages/auth.js"></script>
</body>
</html>
