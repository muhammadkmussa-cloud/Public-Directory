<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set a new password — Ummah Directory</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ummah Directory">
  <meta property="og:title" content="Set a new password — Ummah Directory">
  <meta property="og:description" content="Find halal businesses, mosques with prayer times, and trusted fundis near you.">
  <meta property="og:url" content="https://yourdomain.com/reset.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="description" content="Choose a new password.">
  <link rel="icon" href="assets/img/logo.png" type="image/png">
  <meta name="theme-color" content="#14F528">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/img/logo.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="container auth-wrap">
      <div class="auth-card">
        <h1>Set a new password</h1>
        <p class="sub">Choose a strong password to continue.</p>
        <div id="alertBox"></div>
        <form id="resetForm">
          <div class="form-group">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Min 8 characters">
          </div>
          <div class="form-group">
            <label for="password2">Confirm password</label>
            <input type="password" id="password2" required autocomplete="new-password" placeholder="Re-enter password">
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="resetBtn">Reset password</button>
        </form>
        <div class="auth-alt"><a href="login.html">Back to login</a></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/share.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/pages/auth.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
