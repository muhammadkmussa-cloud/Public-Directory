<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm your email — Ummah Directory</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ummah Directory">
  <meta property="og:title" content="Confirm your email — Ummah Directory">
  <meta property="og:description" content="Confirm your Ummah Directory account email.">
  <meta property="og:url" content="https://yourdomain.com/verify.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="description" content="Confirm your email address to activate your account.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#14F528">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="container auth-wrap">
      <div class="auth-card">
        <h1>Confirm your email</h1>
        <p class="sub">One more step — verify your email address to fully activate your account.</p>
        <div id="alertBox"></div>
        <div id="verifyStatus" class="verify-status" hidden>
          <div class="verify-check">✓</div>
          <h2>Email verified!</h2>
          <p class="muted">Your account is now fully active. You can write reviews, save listings and check in.</p>
          <a class="btn btn-primary btn-block" href="profile.html">Go to my profile</a>
        </div>
        <form id="verifyForm">
          <div class="form-group">
            <label for="verifyEmail">Email address</label>
            <input type="email" id="verifyEmail" name="email" required autocomplete="email" placeholder="you@example.com">
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="verifyBtn">Resend confirmation link</button>
        </form>
        <div class="auth-alt"><a href="login.html">Back to login</a></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/share.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/pages/auth.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
